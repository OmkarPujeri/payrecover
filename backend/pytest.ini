[pytest]
asyncio_mode = auto
# Pin the fixture loop scope explicitly. pytest-asyncio warns when it is unset
# because the default is scheduled to change; every async fixture here (the
# throwaway SQLite engine and its session) is per-test, so name that intent
# rather than inherit whatever a future release decides.
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .
