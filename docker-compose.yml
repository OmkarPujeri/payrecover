# PayRecover — Docker Compose
# `docker compose up --build` boots Postgres + the backend. With no API keys
# the backend runs in SIMULATION mode (mock Razorpay + mock LLM), so it works
# out of the box. The Next.js frontend service is added in a later phase.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payrecover
      POSTGRES_PASSWORD: payrecover
      POSTGRES_DB: payrecover
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payrecover"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://payrecover:payrecover@db:5432/payrecover
      APP_ENV: production
      CORS_ORIGINS: '["http://localhost:3000"]'
      # --- Optional: enable LIVE mode by adding your keys here ---
      # RAZORPAY_KEY_ID: rzp_test_xxxx
      # RAZORPAY_KEY_SECRET: xxxx
      # RAZORPAY_WEBHOOK_SECRET: xxxx
      # GROQ_API_KEY: gsk_xxxx
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
